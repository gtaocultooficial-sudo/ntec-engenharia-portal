name: Deploy NTEC portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.deploy-trigger'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Decode and validate NTEC site files
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 > /tmp/ntec-site.b64
          base64 --decode /tmp/ntec-site.b64 > /tmp/ntec-site.zip
          unzip -t /tmp/ntec-site.zip
          mkdir -p _site
          unzip -oq /tmp/ntec-site.zip -d _site
          test -s _site/index.html
          test -s _site/admin/index.html
          # Fail the build if the login's actual Supabase auth code is missing.
          grep -q "createClient(" _site/admin/index.html
          grep -q "signInWithPassword" _site/admin/index.html
          # Add recovery routes to the static bundle.
          cp recuperar-acesso.html _site/recuperar-acesso.html
          cp atualizar-senha.html _site/atualizar-senha.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("_site/admin/index.html")
          html = page.read_text(encoding="utf-8")
          anchor = '<button class="auth-toggle" id="ntec-show-signup" type="button">Sou cliente — criar acesso</button>'
          link = '<a id="ntec-forgot-password" href="../recuperar-acesso.html" style="display:block;margin-top:12px;text-align:center;color:#1f5f91;font-size:13px">Esqueci minha senha</a>'
          if "ntec-forgot-password" not in html:
              if anchor not in html:
                  raise SystemExit("Could not find login form insertion point; refusing to publish")
              html = html.replace(anchor, anchor + link, 1)
              page.write_text(html, encoding="utf-8")
          PY
          test -s _site/recuperar-acesso.html
          test -s _site/atualizar-senha.html
          rm -f _site/netlify.toml

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
