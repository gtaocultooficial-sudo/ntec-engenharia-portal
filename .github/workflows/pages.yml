name: Deploy NTEC portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.deploy-trigger'
      - 'apply_ntec_report_features.py'
      - 'apply_ntec_pdf_layout.py'
      - 'apply_ntec_rupture_workflow.py'
      - 'apply_ntec_moldagem_ocr.py'
      - 'apply_ntec_programming.py'
      - 'apply_ntec_price_assistant.py'
      - 'supabase/migrations/20261028_proposal_price_reviews.sql'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Decode and validate NTEC site files
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 > /tmp/ntec-site.b64
          base64 --decode /tmp/ntec-site.b64 > /tmp/ntec-site.zip
          unzip -t /tmp/ntec-site.zip
          mkdir -p _site
          unzip -oq /tmp/ntec-site.zip -d _site
          test -s _site/index.html
          test -s _site/admin/index.html
          # Fail the build if the login's actual Supabase auth code is missing.
          grep -q "createClient(" _site/admin/index.html
          grep -q "signInWithPassword" _site/admin/index.html
          # Add recovery routes, the report calculations and persistent equipment defaults.
          cp recuperar-acesso.html _site/recuperar-acesso.html
          cp atualizar-senha.html _site/atualizar-senha.html
          python3 apply_ntec_report_features.py _site/admin/index.html
          python3 apply_ntec_moldagem_ocr.py _site/admin/index.html
          python3 apply_ntec_rupture_workflow.py _site/admin/index.html
          python3 apply_ntec_pdf_layout.py _site/admin/index.html
          python3 apply_ntec_programming.py _site/admin/index.html
          python3 apply_ntec_price_assistant.py _site/admin/index.html
          grep -q "updateReportTitleAuto" _site/admin/index.html
          grep -q "ntecRecalc" _site/admin/index.html
          grep -q "ntecGenerateNarrative" _site/admin/index.html
          grep -q "Referências normativas sugeridas no modelo" _site/admin/index.html
          grep -q "report_number" _site/admin/index.html
          grep -q "Lançar ruptura" _site/admin/index.html
          grep -q "async updateReportResults" _site/admin/index.html
          grep -q "CURVA DE CRESCIMENTO DA RESISTÊNCIA À COMPRESSÃO" _site/admin/index.html
          grep -q "size:A4 portrait" _site/admin/index.html
          grep -q "DADOS DO CLIENTE / OBRA" _site/admin/index.html
          grep -q "NTEC ENGENHARIA &amp; GEOTECNIA" _site/admin/index.html
          grep -q "Carga (tf)" _site/admin/index.html
          grep -q "Importar ficha de moldagem" _site/admin/index.html
          grep -q "ntec-ocr-apply" _site/admin/index.html
          grep -q "loadProgrammingData" _site/admin/index.html
          grep -q "saveProgrammingItem" _site/admin/index.html
          grep -q "page-programacao" _site/admin/index.html
          grep -q "programming_items" _site/admin/index.html
          grep -q "ntec-price-ai-panel" _site/admin/index.html
          grep -q "loadProposalPriceReviews" _site/admin/index.html
          grep -q "ntec-price-autocomplete" _site/admin/index.html
          # Parse every inline JS block after patching; fail before publishing if syntax is invalid.
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      a = dict(attrs)
                      self.current = None if a.get("src") else (a.get("type", "").lower(), [])
              def handle_data(self, data):
                  if self.current is not None:
                      self.current[1].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      kind, parts = self.current
                      self.blocks.append((kind, "".join(parts)))
                      self.current = None
          parser = InlineScripts()
          parser.feed(Path("_site/admin/index.html").read_text(encoding="utf-8"))
          scripts = [(kind, body) for kind, body in parser.blocks if body.strip() and kind not in ("application/json", "application/ld+json")]
          if len(scripts) < 2:
              raise SystemExit(f"Expected the Supabase module and app script; found {len(scripts)} inline script blocks")
          for i, (kind, body) in enumerate(scripts):
              suffix = ".mjs" if kind == "module" else ".js"
              Path(f"/tmp/ntec-inline-{i}{suffix}").write_text(body, encoding="utf-8")
              print(f"Prepared inline script {i} ({kind or 'classic'}, {len(body)} chars)")
          PY
          for script in /tmp/ntec-inline-*.js /tmp/ntec-inline-*.mjs; do
            [ -e "$script" ] || continue
            node --check "$script"
          done
          test -s _site/recuperar-acesso.html
          test -s _site/atualizar-senha.html
          rm -f _site/netlify.toml

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
