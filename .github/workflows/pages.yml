name: Deploy NTEC portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.deploy-trigger'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Decode and validate NTEC site files
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 > /tmp/ntec-site.b64
          base64 --decode /tmp/ntec-site.b64 > /tmp/ntec-site.zip
          unzip -t /tmp/ntec-site.zip
          mkdir -p _site
          unzip -oq /tmp/ntec-site.zip -d _site
          test -s _site/index.html
          test -s _site/admin/index.html
          rm -f _site/netlify.toml

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
