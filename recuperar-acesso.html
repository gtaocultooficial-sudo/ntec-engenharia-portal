<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar acesso | NTEC</title>
<style>
:root{font-family:Arial,sans-serif;color:#10263f;background:#eef3f8}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:white;border-radius:18px;padding:30px;box-shadow:0 18px 50px #10263f20}h1{font-size:24px;margin:0 0 8px}p{color:#5b6c7e;line-height:1.55;font-size:14px}label{display:block;font-weight:700;font-size:13px;margin:18px 0 7px}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{border:1px solid #ccd6e0}button{margin-top:14px;border:0;background:#10263f;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{font-size:13px;min-height:20px;margin-top:12px;overflow-wrap:anywhere}.back{display:block;margin-top:18px;color:#1f5f91;font-size:14px}
</style>
</head>
<body><main class="card">
<h1>Recuperar acesso NTEC</h1>
<p>Informe o e-mail cadastrado no portal. Enviaremos um link para criar uma nova senha. Não é necessário informar a senha atual.</p>
<form id="recovery-form"><label for="email">E-mail da conta</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="180" placeholder="seu@email.com"><button id="send" type="submit">Enviar link de recuperação</button></form>
<div class="msg" id="message" role="status" aria-live="polite"></div>
<a class="back" href="./admin/">Voltar ao login</a>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://ywxqdcepqqsrpnymrcli.supabase.co','sb_publishable_x1wmB9skBnQRBecw5nIIHQ_PZNPBrWX',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('recovery-form'),button=document.getElementById('send'),message=document.getElementById('message');
form.addEventListener('submit',async event=>{
 event.preventDefault();message.textContent='';button.disabled=true;button.textContent='Enviando…';
 try{
  const email=document.getElementById('email').value.trim();
  const redirectTo=new URL('./atualizar-senha.html',window.location.href).href;
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});
  if(error)throw error;
  message.textContent='Se o e-mail estiver cadastrado, enviaremos uma mensagem com o link de recuperação. Confira a caixa de entrada e o spam.';
  form.reset();
 }catch(error){message.textContent='Não foi possível solicitar a recuperação: '+(error?.message||'erro de conexão');}
 finally{button.disabled=false;button.textContent='Enviar link de recuperação';}
});
</script></body></html>
